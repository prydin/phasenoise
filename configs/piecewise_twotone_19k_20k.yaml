# CCIF-style two-tone example with piecewise phase noise.
audio:
  fs_audio_hz: 48000.0
  duration_s: 30.0
  clock_hz: 24576000.0
  rng_seed: 42

signal:
  # Two high-frequency tones to expose IMD from jitter.
  mode: twotone
  multitone_tones_hz:
    - 19000.0
    - 20000.0

phase_noise:
  model: piecewise
  # Anchors are [offset_hz, L(f) dBc/Hz].
  piecewise_points:
    - [0.1, -70.0]
    - [1.0, -95.0]
    - [10.0, -120.0]
    - [1000.0, -145.0]
    - [10000.0, -155.0]

integration:
  fmin_hz: 0.1
  fmax_hz: 24000.0

plots:
  waveform_zoom_periods: 5.0
  jitter_overview_fraction: 0.3
  output_path: output/clock_audio_jitter_results_piecewise_twotone.png
