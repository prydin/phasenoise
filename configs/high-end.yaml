# Alternate high-end OCXO preset using the same piecewise profile.
dut_name: "High end 45158.25kHz OCXO"

audio:
  fs_audio_hz: 48000.0
  duration_s: 20.0
  clock_hz: 4915200.0
  rng_seed: 42

signal:
  mode: twotone
  multitone_tones_hz:
    - 12000.0
    - 250.0
  j_test_bit_depth: 16
  input_tone_hz: 1000.0

phase_noise:
  model: piecewise
  # Anchors are [offset_hz, L(f) dBc/Hz].
  piecewise_points:
    - [0.1, -49.44]
    - [1, -89.66]
    - [10, -118.16]
    - [100, -145.34]
    - [1000, -157.60]
    - [10000, -165.26]
    - [100000, -170.15]
    - [1000000, -171.54]

integration:
  fmin_hz: 0.1
  fmax_hz: 1000000.0
  bw_limited_fmin_hz: 100.0
  bw_limited_fmax_hz: 1000000.0

plots:
  waveform_zoom_periods: 5.0
  jitter_overview_fraction: 0.25
  output_path: output/high-end_results.png
  max_points_per_trace: 1000000
