# Single-tone run using the 2-point power-law phase-noise model.
audio:
  fs_audio_hz: 48000.0
  duration_s: 20.0
  clock_hz: 24576000.0
  rng_seed: 42

signal:
  # Single-tone input for SNR vs jitter evaluation.
  mode: single
  input_tone_hz: 1000.0

phase_noise:
  model: power_law
  # Two anchors define slope and absolute level.
  power_law:
    f1_hz: 0.1
    l1_dbc: -90.0
    f2_hz: 10000.0
    l2_dbc: -150.0

integration:
  fmin_hz: 0.1
  fmax_hz: 24000.0

plots:
  waveform_zoom_periods: 5.0
  jitter_overview_fraction: 0.25
  output_path: output/clock_audio_jitter_results_power_law_single.png
